<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, minimal-ui">
    <title>Unity WebGL Player | promoIthub</title>
  </head>
  <style>
    #unity-container {
      position: fixed;
      top: 0;
      left: 0;
      transform-origin: top left;
      background: black;
    }

    #rotate-notice {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 2em;
      z-index: 9999;
      text-align: center;
    }
  </style>

  <body style="text-align: center; padding: 0; border: 0; margin: 0;">
    <canvas id="unity-canvas" width="1280" height="720" tabindex="-1" style="width: 1280px; height: 720px; background: #231F20"></canvas>
    <div id="rotate-notice">Пожалуйста, поверните устройство в горизонтальный режим</div>
    <script src="Build/WebBuild.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";
      }

      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/WebBuild.data",
        frameworkUrl: "Build/WebBuild.framework.js",
        codeUrl: "Build/WebBuild.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "promoIthub",
        productVersion: "1.0",
      });

      // Orientation handler
      function checkOrientationAndToggleCanvas() {
        var isLandscape = window.innerWidth > window.innerHeight;
        var canvas = document.getElementById('unity-canvas');
        var notice = document.getElementById('rotate-notice');

        if (isLandscape) {
          if (canvas) canvas.style.display = 'block';
          if (notice) notice.style.display = 'none';
        } else {
          if (canvas) canvas.style.display = 'none';
          if (notice) notice.style.display = 'flex';
        }
      }

      window.addEventListener('resize', checkOrientationAndToggleCanvas);
      window.addEventListener('orientationchange', checkOrientationAndToggleCanvas);
      window.addEventListener('load', checkOrientationAndToggleCanvas);
    </script>
  </body>
</html>
